<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gülse'nin Biyoloji Bahçesi 🧬</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; transition: background-color 0.3s ease; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .success-pop { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0.95); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        ::-webkit-scrollbar { width: 6px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { border-radius: 10px; background: rgba(150,150,150,0.3); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body id="pageBody" class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

    <div id="mainContainer" class="w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden flex flex-col transition-all duration-300">
        
        <!-- Header -->
        <div id="headerBox" class="p-5 text-white flex flex-col gap-3 shadow-md z-10 relative">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-wide">Gülse'nin Biyoloji Bahçesi 🧬</h1>
                    <p id="subTitle" class="text-xs sm:text-sm mt-1 opacity-90 flex items-center gap-2">
                        <span>YKS Biyoloji Kampı</span>
                        <span id="streakBadge" class="bg-black/30 px-2.5 py-0.5 rounded-full text-[11px] font-semibold border border-white/20">🔥 1 Günlük Seri</span>
                    </p>
                </div>
                <div class="flex items-center gap-1.5">
                    <button onclick="toggleNoteModal()" title="Sürpriz Not 💌" class="w-9 h-9 rounded-xl text-base flex items-center justify-center bg-black/20 hover:bg-black/45 transition shadow-sm border border-white/20 relative">
                        💌
                        <span id="noteDot" class="absolute -top-1 -right-1 w-3 h-3 bg-rose-500 rounded-full border-2 border-white"></span>
                    </button>
                    <button onclick="toggleStatsModal()" title="Performans Analizi" class="w-9 h-9 rounded-xl text-base flex items-center justify-center bg-black/20 hover:bg-black/45 transition shadow-sm border border-white/20">
                        📊
                    </button>
                    <div id="scoreBox" class="text-right px-3 py-1.5 rounded-xl backdrop-blur-sm border">
                        <div id="scoreLabel" class="text-[10px] font-medium uppercase tracking-wider">Doğru</div>
                        <div class="text-xl font-bold font-mono text-center" id="scoreDisplay">0</div>
                    </div>
                </div>
            </div>

            <!-- Tema Seçici -->
            <div class="flex items-center gap-2 overflow-x-auto pb-1 pt-1 no-scrollbar justify-center sm:justify-start">
                <span class="text-[11px] font-medium opacity-80 whitespace-nowrap mr-1">Tema:</span>
                <button onclick="setTheme('yesil')" title="Gece Yeşili" class="w-8 h-8 rounded-xl text-sm flex items-center justify-center bg-black/20 hover:bg-black/40 transition">🌿</button>
                <button onclick="setTheme('bordo')" title="Bordo Gece" class="w-8 h-8 rounded-xl text-sm flex items-center justify-center bg-black/20 hover:bg-black/40 transition">🍷</button>
                <button onclick="setTheme('mor')" title="Gece Moru" class="w-8 h-8 rounded-xl text-sm flex items-center justify-center bg-black/20 hover:bg-black/40 transition">💜</button>
                <button onclick="setTheme('bebek')" title="Bebek Mavisi" class="w-8 h-8 rounded-xl text-sm flex items-center justify-center bg-black/20 hover:bg-black/40 transition">🍼</button>
                <button onclick="setTheme('papatya')" title="Papatya Krem" class="w-8 h-8 rounded-xl text-sm flex items-center justify-center bg-black/20 hover:bg-black/40 transition">🌼</button>
                <button onclick="setTheme('nane')" title="Nane Yeşili" class="w-8 h-8 rounded-xl text-sm flex items-center justify-center bg-black/20 hover:bg-black/40 transition">🍃</button>
            </div>
        </div>

        <!-- Ünite / Konu Filtre Çubuğu -->
        <div id="topicBar" class="flex items-center gap-2 px-4 py-2.5 overflow-x-auto no-scrollbar border-b text-xs sm:text-sm font-semibold"></div>

        <!-- Zorluk Seviyesi Filtre Çubuğu -->
        <div id="difficultyBar" class="flex items-center justify-between gap-1.5 px-4 py-2 border-b text-xs font-semibold"></div>

        <!-- Soru Alanı -->
        <div id="contentBox" class="p-5 sm:p-6 flex-1 flex flex-col relative">
            
            <!-- Üst Bilgi Rozetleri -->
            <div class="flex flex-wrap justify-between items-center mb-4 gap-2">
                <span id="categoryBadge" class="text-[11px] font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow-sm">
                    Konu
                </span>
                <div class="flex items-center gap-1.5">
                    <span id="levelBadge" class="text-[11px] font-semibold px-2.5 py-1 rounded-lg border">
                        Seviye
                    </span>
                    <span id="sourceBadge" class="text-[11px] font-medium px-2.5 py-1 rounded-lg opacity-80 border">
                        Kaynak
                    </span>
                </div>
            </div>

            <!-- Şekilli Soru Görsel Alanı (Tema Uyumlu) -->
            <div id="imageWrapper" class="hidden mb-4 rounded-2xl overflow-hidden border flex flex-col items-center justify-center p-3 relative">
                <img id="questionImage" src="" alt="Soru Şekli" class="max-h-60 w-auto object-contain rounded-xl cursor-pointer transition-all duration-300" onclick="window.open(this.src, '_blank')" title="Büyütmek için tıkla">
                <span id="imageFallbackText" class="hidden text-xs py-6 px-4 text-center opacity-70"></span>
                <button id="imgModeToggle" onclick="toggleImageInvert()" class="mt-2 self-end text-[10px] px-2.5 py-1 rounded-lg border opacity-70 hover:opacity-100 transition">
                    🖼️ Orijinal Renk
                </button>
            </div>

            <!-- Soru Metni -->
            <div class="mb-5">
                <p id="questionText" class="text-base sm:text-lg font-semibold leading-relaxed whitespace-pre-line"></p>
            </div>

            <!-- 5 Şıklı YKS Seçenekleri -->
            <div id="optionsContainer" class="grid grid-cols-1 gap-2.5 mb-4"></div>

            <!-- Çözüm ve Biyolog Notu Alanı -->
            <div id="feedbackArea" class="hidden rounded-2xl p-4 mb-4 text-left shadow-inner border">
                <div class="flex items-center gap-2 mb-1.5">
                    <span id="feedbackIcon" class="text-2xl"></span>
                    <h3 id="feedbackTitle" class="font-bold text-base"></h3>
                </div>
                <p id="feedbackMessage" class="text-xs sm:text-sm leading-relaxed"></p>
            </div>

            <!-- Sonraki Soru Butonu -->
            <button id="nextBtn" onclick="loadNextQuestion()" class="hidden w-full font-bold py-3.5 rounded-xl shadow-lg transition-transform transform active:scale-95 text-base">
                Sonraki Soruya Geç ➡️
            </button>
        </div>
    </div>

    <!-- Sürpriz Not Modalı -->
    <div id="noteModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
        <div id="noteModalContent" class="w-full max-w-sm rounded-3xl p-6 shadow-2xl border flex flex-col gap-4 text-center">
            <div class="text-4xl">💌</div>
            <h2 class="text-lg font-bold">Biyolog Sevgilinden Not Var</h2>
            <div id="secretNoteText" class="p-4 rounded-2xl bg-black/10 dark:bg-white/10 text-sm leading-relaxed font-medium italic">
                "Mitozun evreleri gibi hayatımızın her aşamasında yanındayım. Soruları parçala geç meleğim! ❤️🧬"
            </div>
            <button onclick="toggleNoteModal()" class="w-full py-3 rounded-xl font-bold text-white transition shadow-md" style="background-color: var(--header-bg, #065F46);">
                Devam Et 💪
            </button>
        </div>
    </div>

    <!-- İstatistik Modalı -->
    <div id="statsModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 fade-in">
        <div id="modalContent" class="w-full max-w-md rounded-3xl p-6 shadow-2xl border flex flex-col gap-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="text-lg font-bold flex items-center gap-2">📊 Biyoloji Performans Analizi</h2>
                <button onclick="toggleStatsModal()" class="w-8 h-8 rounded-full flex items-center justify-center bg-black/10 font-bold hover:bg-black/20 transition">✕</button>
            </div>
            <div id="statsBody" class="flex flex-col gap-4 text-sm"></div>
            <button onclick="toggleStatsModal()" class="w-full py-3 rounded-xl font-bold text-white transition shadow-md" style="background-color: var(--header-bg, #065F46);">
                Çalışmaya Dön 🧬
            </button>
        </div>
    </div>

    <script>
        const DEFAULT_QUESTIONS = [
            {
                id: "ornek_01",
                kaynak: "AI",
                konu: "Hücre Bölünmeleri",
                seviye: "Orta",
                soru: "İnterfaz evresinde gerçekleşen;\nI. DNA'nın kendini eşlemesi\nII. ATP sentezinin hızlanması\nIII. Sentrozom eşlenmesi\nolaylarından hangileri olgun bir sinir hücresinde kesinlikle gerçekleşmez?",
                gorsel: null,
                siklar: ["Yalnız I", "Yalnız II", "I ve III", "II ve III", "I, II ve III"],
                cevap: "I ve III",
                biyologNotu: "Olgun sinir hücreleri G0 evresinde kalır, bölünmezler. Bu yüzden DNA ve sentrozom eşlemesi (I ve III) yapmazlar ama yaşamsal faaliyetleri için ATP sentezlemeye devam ederler."
            }
        ];

        const memory = {
            data: {},
            save(key, value) {
                this.data[key] = value;
                try { localStorage.setItem(key, JSON.stringify(value)); } catch(e) {}
            },
            get(key, defaultValue) {
                if (this.data[key] !== undefined) return this.data[key];
                try {
                    const val = localStorage.getItem(key);
                    if (val !== null) {
                        this.data[key] = JSON.parse(val);
                        return this.data[key];
                    }
                } catch(e) {}
                return defaultValue;
            }
        };

        let allQuestions = [];
        let filteredQuestions = [];
        let currentTopic = 'Tümü';
        let currentDifficulty = 'Tümü';
        let currentQuestion = null;
        let isAnswered = false;
        let invertImageEnabled = true;

        let currentScore = memory.get('gulse_bio_score', 0);
        let currentTheme = memory.get('gulse_bio_theme', 'yesil');
        let solvedIds = memory.get('gulse_bio_solved_ids', []);
        let stats = memory.get('gulse_bio_stats', {});

        function checkStreak() {
            const today = new Date().toDateString();
            let lastActive = memory.get('gulse_bio_last_date', null);
            let streak = memory.get('gulse_bio_streak', 1);

            if (!lastActive) {
                memory.save('gulse_bio_last_date', today);
                memory.save('gulse_bio_streak', 1);
                return 1;
            }
            const diffDays = Math.round((new Date(today) - new Date(lastActive)) / (1000 * 60 * 60 * 24));
            if (diffDays === 1) {
                streak++;
                memory.save('gulse_bio_streak', streak);
                memory.save('gulse_bio_last_date', today);
            } else if (diffDays > 1) {
                streak = 1;
                memory.save('gulse_bio_streak', 1);
                memory.save('gulse_bio_last_date', today);
            }
            return memory.get('gulse_bio_streak', 1);
        }

        let currentStreak = checkStreak();

        function recordDailyActivity() {
            const todayKey = new Date().toISOString().slice(0, 10);
            let weeklyData = memory.get('gulse_bio_weekly', {});
            weeklyData[todayKey] = (weeklyData[todayKey] || 0) + 1;
            memory.save('gulse_bio_weekly', weeklyData);
        }

        const themes = {
            yesil: {
                bg: '#090D0B', card: '#121A16', headerBg: '#065F46', headerText: '#ffffff', subText: '#A7F3D0',
                scoreBg: 'rgba(6, 95, 70, 0.6)', scoreText: '#A7F3D0', menuBg: '#121A16', 
                tabInactive: '#8A9A93', textMain: '#E2E8F0', 
                badgeBg: '#1A2E26', badgeText: '#6EE7B7', badgeBorder: 'rgba(6, 95, 70, 0.4)',
                btnBg: '#1A2E26', btnBorder: '#23382F', btnText: '#E2E8F0', 
                btnHoverBg: '#22382F', pillBg: '#23382F',
                nextBg: '#065F46', nextText: '#ffffff'
            },
            bordo: {
                bg: '#121212', card: '#1E1E1E', headerBg: '#722F37', headerText: '#ffffff', subText: '#fecaca',
                scoreBg: 'rgba(74, 22, 28, 0.6)', scoreText: '#fecaca', menuBg: '#1E1E1E', 
                tabInactive: '#a0a0a0', textMain: '#E0E0E0', 
                badgeBg: '#262626', badgeText: '#fca5a5', badgeBorder: 'rgba(127, 29, 29, 0.4)',
                btnBg: '#262626', btnBorder: '#404040', btnText: '#E0E0E0', 
                btnHoverBg: '#2D2D2D', pillBg: '#333333',
                nextBg: '#722F37', nextText: '#ffffff'
            },
            mor: {
                bg: '#0B0910', card: '#15121F', headerBg: '#5B21B6', headerText: '#ffffff', subText: '#DDD6FE',
                scoreBg: 'rgba(91, 33, 182, 0.6)', scoreText: '#DDD6FE', menuBg: '#15121F', 
                tabInactive: '#9CA3AF', textMain: '#F3F4F6', 
                badgeBg: '#231D33', badgeText: '#C4B5FD', badgeBorder: 'rgba(91, 33, 182, 0.4)',
                btnBg: '#231D33', btnBorder: '#31274A', btnText: '#F3F4F6', 
                btnHoverBg: '#2D2342', pillBg: '#31274A',
                nextBg: '#5B21B6', nextText: '#ffffff'
            },
            bebek: {
                bg: '#E0F2FE', card: '#FFFFFF', headerBg: '#1E3A8A', headerText: '#ffffff', subText: '#bae6fd',
                scoreBg: 'rgba(30, 58, 138, 0.6)', scoreText: '#bae6fd', menuBg: '#f0f9ff', 
                tabInactive: '#0369a1', textMain: '#0f172a', 
                badgeBg: '#f0f9ff', badgeText: '#1e40af', badgeBorder: '#bae6fd',
                btnBg: '#f0f9ff', btnBorder: '#bae6fd', btnText: '#0f172a', 
                btnHoverBg: '#e0f2fe', pillBg: '#bae6fd',
                nextBg: '#1E3A8A', nextText: '#ffffff'
            },
            papatya: {
                bg: '#FEF3C7', card: '#FFFFFF', headerBg: '#78350F', headerText: '#ffffff', subText: '#fde68a',
                scoreBg: 'rgba(120, 53, 15, 0.6)', scoreText: '#fde68a', menuBg: '#fffbeb', 
                tabInactive: '#b45309', textMain: '#451a03', 
                badgeBg: '#fffbeb', badgeText: '#78350F', badgeBorder: '#fde68a',
                btnBg: '#fffbeb', btnBorder: '#fde68a', btnText: '#451a03', 
                btnHoverBg: '#fef3c7', pillBg: '#fde68a',
                nextBg: '#78350F', nextText: '#ffffff'
            },
            nane: {
                bg: '#ECFDF5', card: '#FFFFFF', headerBg: '#047857', headerText: '#ffffff', subText: '#a7f3d0',
                scoreBg: 'rgba(4, 120, 87, 0.6)', scoreText: '#a7f3d0', menuBg: '#f0fdf4', 
                tabInactive: '#059669', textMain: '#064e3b', 
                badgeBg: '#f0fdf4', badgeText: '#064e3b', badgeBorder: '#a7f3d0',
                btnBg: '#f0fdf4', btnBorder: '#a7f3d0', btnText: '#064e3b', 
                btnHoverBg: '#ecfdf5', pillBg: '#a7f3d0',
                nextBg: '#047857', nextText: '#ffffff'
            }
        };

        function toggleImageInvert() {
            invertImageEnabled = !invertImageEnabled;
            applyImageThemeStyle();
        }

        function applyImageThemeStyle() {
            let t = themes[currentTheme] || themes.yesil;
            const imgWrap = document.getElementById('imageWrapper');
            const imgEl = document.getElementById('questionImage');
            const toggleBtn = document.getElementById('imgModeToggle');
            if (!imgEl || !imgWrap) return;

            imgWrap.style.borderColor = t.btnBorder;
            if (toggleBtn) {
                toggleBtn.style.borderColor = t.btnBorder;
                toggleBtn.style.color = t.textMain;
            }

            const isDark = ['yesil', 'bordo', 'mor'].includes(currentTheme);

            if (!invertImageEnabled) {
                imgEl.style.filter = 'none';
                imgEl.style.mixBlendMode = 'normal';
                imgEl.style.backgroundColor = '#ffffff';
                imgEl.style.padding = '8px';
                if (toggleBtn) toggleBtn.innerText = '🌓 Tema Uyumuna Geç';
                return;
            }

            imgEl.style.backgroundColor = 'transparent';
            imgEl.style.padding = '0';

            if (isDark) {
                imgEl.style.filter = 'contrast(1.15) brightness(1.05) invert(1) hue-rotate(180deg)';
                imgEl.style.mixBlendMode = 'screen';
            } else {
                imgEl.style.filter = 'contrast(1.08)';
                imgEl.style.mixBlendMode = 'multiply';
            }

            if (toggleBtn) toggleBtn.innerText = '🖼️ Orijinal Renk';
        }

        function setTheme(themeKey) {
            currentTheme = themeKey;
            memory.save('gulse_bio_theme', themeKey);
            applyTheme();
            if (currentQuestion) renderOptions(currentQuestion);
        }

        function applyTheme() {
            let t = themes[currentTheme] || themes.yesil;
            document.documentElement.style.setProperty('--header-bg', t.headerBg);
            document.getElementById('pageBody').style.backgroundColor = t.bg;
            
            let container = document.getElementById('mainContainer');
            container.style.backgroundColor = t.card;
            container.style.borderColor = t.btnBorder;
            container.style.borderWidth = '1px';

            let header = document.getElementById('headerBox');
            header.style.backgroundColor = t.headerBg;
            header.style.color = t.headerText;
            document.getElementById('subTitle').style.color = t.subText;
            document.getElementById('streakBadge').innerText = `🔥 ${currentStreak} Günlük Seri`;

            let scoreBox = document.getElementById('scoreBox');
            scoreBox.style.backgroundColor = t.scoreBg;
            scoreBox.style.borderColor = t.subText;
            document.getElementById('scoreLabel').style.color = t.scoreText;
            document.getElementById('scoreDisplay').style.color = t.headerText;

            ['topicBar', 'difficultyBar'].forEach(id => {
                let bar = document.getElementById(id);
                bar.style.backgroundColor = t.menuBg;
                bar.style.borderColor = t.btnBorder;
            });

            let badge = document.getElementById('categoryBadge');
            badge.style.backgroundColor = t.badgeBg;
            badge.style.color = t.badgeText;
            badge.style.border = `1px solid ${t.badgeBorder}`;

            ['sourceBadge', 'levelBadge'].forEach(id => {
                let el = document.getElementById(id);
                el.style.borderColor = t.btnBorder;
                el.style.color = t.textMain;
            });

            document.getElementById('questionText').style.color = t.textMain;

            let nextBtn = document.getElementById('nextBtn');
            nextBtn.style.backgroundColor = t.nextBg;
            nextBtn.style.color = t.nextText;

            ['modalContent', 'noteModalContent'].forEach(id => {
                let el = document.getElementById(id);
                el.style.backgroundColor = t.card;
                el.style.borderColor = t.btnBorder;
                el.style.color = t.textMain;
            });

            applyImageThemeStyle();
            renderTopicTabs();
            renderDifficultyTabs();
        }

        function renderTopicTabs() {
            let t = themes[currentTheme] || themes.yesil;
            const bar = document.getElementById('topicBar');
            const topics = ['Tümü', ...new Set(allQuestions.map(q => q.konu))];
            bar.innerHTML = '';

            topics.forEach(topic => {
                const btn = document.createElement('button');
                const isActive = (topic === currentTopic);
                btn.className = 'px-3 py-1.5 rounded-xl whitespace-nowrap transition-all';
                btn.innerText = topic;
                btn.style.backgroundColor = isActive ? t.headerBg : 'transparent';
                btn.style.color = isActive ? '#ffffff' : t.tabInactive;
                btn.onclick = () => {
                    currentTopic = topic;
                    filterQuestions();
                    renderTopicTabs();
                    loadNextQuestion();
                };
                bar.appendChild(btn);
            });
        }

        function renderDifficultyTabs() {
            let t = themes[currentTheme] || themes.yesil;
            const bar = document.getElementById('difficultyBar');
            const levels = [
                { key: 'Tümü', label: 'Tümü' },
                { key: 'Kolay', label: '🟢 Kolay' },
                { key: 'Orta', label: '🟡 Orta' },
                { key: 'Zor', label: '🔴 Zor' }
            ];
            bar.innerHTML = '';

            levels.forEach(lvl => {
                const btn = document.createElement('button');
                const isActive = (lvl.key === currentDifficulty);
                btn.className = 'flex-1 py-1.5 rounded-xl transition-all text-center';
                btn.innerText = lvl.label;
                btn.style.backgroundColor = isActive ? t.badgeBg : 'transparent';
                btn.style.color = isActive ? t.badgeText : t.tabInactive;
                btn.style.border = isActive ? `1px solid ${t.badgeBorder}` : '1px solid transparent';
                btn.onclick = () => {
                    currentDifficulty = lvl.key;
                    filterQuestions();
                    renderDifficultyTabs();
                    loadNextQuestion();
                };
                bar.appendChild(btn);
            });
        }

        function filterQuestions() {
            filteredQuestions = allQuestions.filter(q => {
                const topicMatch = (currentTopic === 'Tümü' || q.konu === currentTopic);
                const qLevel = q.seviye || 'Orta';
                const diffMatch = (currentDifficulty === 'Tümü' || qLevel === currentDifficulty);
                return topicMatch && diffMatch;
            });
        }

        async function loadQuestionBank() {
            try {
                const response = await fetch('data/sorular.json');
                if (!response.ok) throw new Error('JSON bulunamadı');
                const data = await response.json();
                allQuestions = (Array.isArray(data) && data.length > 0) ? data : DEFAULT_QUESTIONS;
            } catch (err) {
                allQuestions = DEFAULT_QUESTIONS;
            }
            filterQuestions();
            applyTheme();
            document.getElementById('scoreDisplay').innerText = currentScore;
            loadNextQuestion();
        }

        function loadNextQuestion() {
            isAnswered = false;
            invertImageEnabled = true;
            document.getElementById('feedbackArea').classList.add('hidden');
            document.getElementById('nextBtn').classList.add('hidden');

            if (filteredQuestions.length === 0) {
                currentQuestion = null;
                document.getElementById('categoryBadge').innerText = currentTopic;
                document.getElementById('levelBadge').innerText = currentDifficulty;
                document.getElementById('sourceBadge').innerText = '-';
                document.getElementById('imageWrapper').classList.add('hidden');
                document.getElementById('optionsContainer').innerHTML = '';
                document.getElementById('questionText').innerText = `"${currentTopic}" konusunda "${currentDifficulty}" seviyesinde henüz soru eklenmedi.`;
                return;
            }

            let unsolved = filteredQuestions.filter(q => !solvedIds.includes(q.id));
            let pool = unsolved.length > 0 ? unsolved : filteredQuestions;
            
            if (pool.length > 1 && currentQuestion) {
                pool = pool.filter(q => q.id !== currentQuestion.id);
            }

            currentQuestion = pool[Math.floor(Math.random() * pool.length)];

            const qLevel = currentQuestion.seviye || 'Orta';
            const levelIcon = qLevel === 'Kolay' ? '🟢' : (qLevel === 'Zor' ? '🔴' : '🟡');

            document.getElementById('categoryBadge').innerText = currentQuestion.konu;
            document.getElementById('levelBadge').innerText = `${levelIcon} ${qLevel}`;
            document.getElementById('sourceBadge').innerText = currentQuestion.kaynak === 'PDF' ? '📖 PDF' : '🤖 AI';
            document.getElementById('questionText').innerText = currentQuestion.soru;

            const imgWrap = document.getElementById('imageWrapper');
            const imgEl = document.getElementById('questionImage');
            const imgFallback = document.getElementById('imageFallbackText');
            const toggleBtn = document.getElementById('imgModeToggle');

            if (currentQuestion.gorsel) {
                imgWrap.classList.remove('hidden');
                imgEl.classList.remove('hidden');
                imgFallback.classList.add('hidden');
                if (toggleBtn) toggleBtn.classList.remove('hidden');
                imgEl.src = currentQuestion.gorsel;
                applyImageThemeStyle();
                imgEl.onerror = () => {
                    imgEl.classList.add('hidden');
                    if (toggleBtn) toggleBtn.classList.add('hidden');
                    imgFallback.classList.remove('hidden');
                    imgFallback.innerText = `🖼️ Görsel bekleniyor: ${currentQuestion.gorsel}`;
                };
            } else {
                imgWrap.classList.add('hidden');
                imgEl.src = '';
            }

            renderOptions(currentQuestion);
        }

        function renderOptions(q) {
            let t = themes[currentTheme] || themes.yesil;
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            const labels = ['A', 'B', 'C', 'D', 'E'];

            q.siklar.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'w-full border-2 font-medium py-3 px-4 rounded-2xl flex items-center transition-all duration-200 text-sm sm:text-base shadow-sm text-left';
                btn.style.backgroundColor = t.btnBg;
                btn.style.borderColor = t.btnBorder;
                btn.style.color = t.btnText;

                btn.onmouseover = () => { btn.style.backgroundColor = t.btnHoverBg; btn.style.borderColor = t.headerBg; };
                btn.onmouseout = () => { btn.style.backgroundColor = t.btnBg; btn.style.borderColor = t.btnBorder; };

                btn.innerHTML = `
                    <span class="rounded-full w-8 h-8 flex-shrink-0 flex items-center justify-center mr-3 font-bold text-xs sm:text-sm" style="background-color: ${t.pillBg}; color: ${t.badgeText};">${labels[index]}</span> 
                    <span class="flex-1">${opt}</span>
                `;
                btn.onclick = () => handleAnswer(opt, btn);
                container.appendChild(btn);
            });
        }

        function handleAnswer(selectedOption, clickedBtn) {
            if (isAnswered || !currentQuestion) return;
            isAnswered = true;

            const isCorrect = (String(selectedOption).trim() === String(currentQuestion.cevap).trim());
            const konu = currentQuestion.konu;

            if (!stats[konu]) stats[konu] = { correct: 0, wrong: 0 };

            if (isCorrect) {
                stats[konu].correct++;
                currentScore++;
                memory.save('gulse_bio_score', currentScore);
                document.getElementById('scoreDisplay').innerText = currentScore;

                if (!solvedIds.includes(currentQuestion.id)) {
                    solvedIds.push(currentQuestion.id);
                    memory.save('gulse_bio_solved_ids', solvedIds);
                }
            } else {
                stats[konu].wrong++;
            }

            memory.save('gulse_bio_stats', stats);
            recordDailyActivity();

            const allBtns = document.querySelectorAll('#optionsContainer button');
            allBtns.forEach(btn => {
                btn.disabled = true;
                btn.onmouseover = null; btn.onmouseout = null;
                const btnText = btn.querySelectorAll('span')[1].innerText.trim();
                if (btnText === String(currentQuestion.cevap).trim()) {
                    btn.style.borderColor = '#16a34a'; btn.style.backgroundColor = 'rgba(22, 163, 74, 0.2)'; btn.style.color = '#86efac';
                    btn.querySelectorAll('span')[0].style.backgroundColor = '#16a34a'; btn.querySelectorAll('span')[0].style.color = '#ffffff';
                } else if (btn === clickedBtn && !isCorrect) {
                    btn.style.borderColor = '#d97706'; btn.style.backgroundColor = 'rgba(217, 119, 6, 0.2)'; btn.style.color = '#fde047';
                    btn.querySelectorAll('span')[0].style.backgroundColor = '#d97706'; btn.querySelectorAll('span')[0].style.color = '#ffffff';
                } else {
                    btn.style.opacity = '0.45';
                }
            });

            let fa = document.getElementById('feedbackArea');
            fa.classList.remove('hidden');

            const noteText = currentQuestion.biyologNotu || "Bu sorunun detayını birlikte inceleyelim.";

            if (isCorrect) {
                fa.className = "rounded-2xl p-4 mb-4 text-left border bg-emerald-950/40 text-emerald-200 border-emerald-600 success-pop";
                document.getElementById('feedbackIcon').innerText = "🧬";
                document.getElementById('feedbackTitle').innerText = "Harika! Doğru Cevap.";
                document.getElementById('feedbackMessage').innerHTML = `<b>Biyolog Notu:</b> ${noteText}`;
            } else {
                fa.className = "rounded-2xl p-4 mb-4 text-left border bg-amber-950/40 text-amber-200 border-amber-600 fade-in";
                document.getElementById('feedbackIcon').innerText = "🔬";
                document.getElementById('feedbackTitle').innerText = `Doğru Cevap: ${currentQuestion.cevap}`;
                document.getElementById('feedbackMessage').innerHTML = `<b>Biyolog Notu:</b> ${noteText}`;
            }

            const nextBtn = document.getElementById('nextBtn');
            nextBtn.classList.add('fade-in');
            nextBtn.classList.remove('hidden');
        }

        function toggleNoteModal() {
            let modal = document.getElementById('noteModal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                document.getElementById('noteDot').style.display = 'none';
            }
        }

        function toggleStatsModal() {
            let modal = document.getElementById('statsModal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                renderStatsContent();
            }
        }

        function renderStatsContent() {
            let body = document.getElementById('statsBody');
            let weeklyData = memory.get('gulse_bio_weekly', {});
            let days = ['Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt', 'Paz'];
            let today = new Date();
            let chartHTML = '';
            let maxVal = 1;

            let last7Days = [];
            for (let i = 6; i >= 0; i--) {
                let d = new Date(today);
                d.setDate(today.getDate() - i);
                let dateKey = d.toISOString().slice(0, 10);
                let count = weeklyData[dateKey] || 0;
                if (count > maxVal) maxVal = count;
                let dayName = days[(d.getDay() + 6) % 7];
                last7Days.push({ dayName, count });
            }

            last7Days.forEach(item => {
                let heightPercent = Math.max(Math.round((item.count / maxVal) * 100), 12);
                chartHTML += `
                    <div class="flex-1 flex flex-col items-center gap-1">
                        <span class="text-[10px] font-mono opacity-80">${item.count}</span>
                        <div class="w-full bg-emerald-500/20 rounded-t-lg h-24 flex items-end overflow-hidden">
                            <div class="w-full bg-emerald-500 transition-all duration-500 rounded-t-lg" style="height: ${heightPercent}%"></div>
                        </div>
                        <span class="text-[11px] font-medium opacity-90">${item.dayName}</span>
                    </div>
                `;
            });

            body.innerHTML = `
                <div class="p-3 rounded-2xl bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 flex justify-between items-center font-bold">
                    <span>🔥 Biyoloji Çalışma Serisi:</span>
                    <span class="text-amber-500 text-lg">${currentStreak} Gün</span>
                </div>

                <div class="p-4 rounded-2xl bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 flex flex-col gap-2">
                    <div class="text-xs font-bold uppercase tracking-wider opacity-80 mb-1">📈 Son 7 Günlük Soru Çözümü</div>
                    <div class="flex items-end gap-2 h-32 pt-2">
                        ${chartHTML}
                    </div>
                </div>
            `;

            if (Object.keys(stats).length === 0) {
                body.innerHTML += `<p class="text-center text-xs opacity-70 py-2">Henüz soru çözülmedi. İlk soruyu çözünce ünite analizleri burada görünecek 🌸</p>`;
                return;
            }

            for (let konu in stats) {
                let data = stats[konu];
                let total = data.correct + data.wrong;
                let rate = total > 0 ? Math.round((data.correct / total) * 100) : 0;
                let rateColor = rate >= 80 ? "text-emerald-500 font-bold" : (rate >= 60 ? "text-amber-500 font-bold" : "text-rose-500 font-bold");

                let div = document.createElement('div');
                div.className = "p-3 rounded-2xl bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10 flex flex-col gap-1.5";
                div.innerHTML = `
                    <div class="flex justify-between items-center font-semibold">
                        <span>${konu}</span>
                        <span class="${rateColor}">${rate}% (${data.correct}D / ${data.wrong}Y)</span>
                    </div>
                    <div class="w-full bg-black/10 dark:bg-white/10 h-2 rounded-full overflow-hidden">
                        <div class="h-full bg-emerald-500 transition-all duration-500" style="width: ${rate}%"></div>
                    </div>
                `;
                body.appendChild(div);
            }
        }

        loadQuestionBank();
    </script>
</body>
</html>
